[package]
name = "imgchest"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
itoa = "1.0.18"
jiff = "0.2.29"
reqwest = { version = "0.13.4", features = [ "cookies", "http2", "json", "multipart", "stream", "form" ], default-features = false }
reqwest_cookie_store = "0.10.0"
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.228", features = [ "derive" ]}
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = "1.52.3"
tokio-util = "0.7.18"

[dev-dependencies]
tokio = { version = "1.52.3", features = [ "macros" ] }

[features]
default = [ "rustls" ]
native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]
